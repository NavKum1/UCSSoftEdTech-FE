# S4b help center search (docs/s4b_help_center_for_everyone_plan.md, item 3): the words people type, mapped to the words the
# articles use. scripts/help-build.ts checks that every word on the right is used in an article, and that each search in
# "checks" finds the right article first (as the person named). Add words from the searches that found nothing
# (Edulexa staff see them on /admin/support).

words:
  # Handing in
  submit: [hand in]
  submission: [hand in]
  turn in: [hand in]
  upload: [hand in, upload]
  assignment: [assessment]
  homework: [assessment]
  test: [assessment, exam]
  deadline: [due]
  late: [due]
  # Signing in
  login: [sign in]
  log in: [sign in]
  logon: [sign in]
  log out: [sign out]
  logout: [sign out]
  password: [password, sign in]
  locked out: [sign in]
  two factor: [code]
  # The viva
  oral exam: [viva]
  oral: [viva]
  defense: [viva]
  defend: [viva]
  voice: [voice, viva]
  mic: [microphone]
  audio: [microphone]
  transcript: [every question and answer]
  # Results
  marks: [score, result]
  mark: [score, result]
  grade: [score, result]
  grades: [score, result]
  certificate: [credential]
  certificates: [credential]
  badge: [credential]
  # Teachers
  cheating: [points to talk about, much like another student's]
  plagiarism: [points to talk about, much like another student's]
  copied: [points to talk about, much like another student's]
  ai detection: [points to talk about]
  add students: [add people, roster]
  add student: [add people, roster]
  add teachers: [add people]
  invite: [add people, invite]
  # Career
  resume: [résumé]
  resumes: [résumé]
  cv: [résumé]
  meeting: [appointment]
  counselor: [career center, appointment]
  advisor: [career center, appointment]
  job: [job]
  jobs: [job]
  placement: [placement, job]
  # Account
  dark mode: [dark]
  theme: [dark, light]
  emails: [e-mail]
  email: [e-mail]
  alerts: [notification]
  refund: [billing]
  invoice: [billing]
  payment: [billing]
  contact: [contact, support]
  delete my account: [delete your account, your data]
  delete account: [delete your account, your data]

