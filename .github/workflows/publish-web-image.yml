name: Publish web image

# The web app has its public addresses baked in at build time, so one image is built per region.
# Run it from the Actions tab: region "us" or "in", and that region's app and API addresses.
on:
  workflow_dispatch:
    inputs:
      region:
        description: Region tag prefix (us or in)
        required: true
        default: us
      app_url:
        description: Web address, e.g. https://app.us.example.com
        required: true
      api_url:
        description: API address, e.g. https://api.us.example.com
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          image=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/edulexa-web
          echo "list=$image:${{ inputs.region }}-${GITHUB_SHA::7},$image:${{ inputs.region }}-latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ inputs.api_url }}
            NEXT_PUBLIC_APP_URL=${{ inputs.app_url }}
            NEXT_PUBLIC_AUTH_PROVIDER=keycloak
            NEXT_PUBLIC_ENABLE_DEMO_LOGIN=false
            NEXT_PUBLIC_VAPI_PUBLIC_KEY=${{ vars.VAPI_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
